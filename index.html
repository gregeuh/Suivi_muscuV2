<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>FitTrack Pro</title>
    <style>
        :root {
            --primary: #007AFF;
            --primary-light: #5AC8FA;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --bg-secondary: #FFFFFF;
            --surface: rgba(255, 255, 255, 0.8);
            --text-primary: #000000;
            --text-secondary: #3C3C43;
            --text-tertiary: #8E8E93;
            --divider: rgba(60, 60, 67, 0.18);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 0.5px solid var(--divider);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: env(safe-area-inset-top) 0 0;
        }

        .header-content {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .streak {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 20px 100px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 0.5px solid var(--divider);
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.4px;
        }

        .quick-add {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
            box-shadow: var(--shadow-lg);
        }

        .quick-add-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .quick-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.35);
        }

        .quick-icon {
            font-size: 28px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 0.5px solid var(--divider);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .stat-progress {
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            /* Animation de progression fluide */
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: -0.4px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-primary);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 0.5px solid var(--divider);
            border-radius: 10px;
            font-size: 17px;
            background: var(--bg-secondary);
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-tertiary);
            cursor: pointer;
            line-height: 1;
        }

        .meal-grid {
            display: grid;
            gap: 12px;
        }

        .meal-card {
            background: var(--bg);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meal-card:active {
            transform: scale(0.98);
            background: rgba(0, 0, 0, 0.05);
        }

        .voice-btn {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            z-index: 99;
        }

        .voice-btn.listening {
            animation: pulse 1.5s infinite;
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 0.5px solid var(--divider);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 100;
            display: flex;
            justify-content: space-around;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
        }

        .tab-item.active { color: var(--primary); }

        .tab-icon { font-size: 24px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--divider);
        }

        .notification {
            position: fixed;
            top: calc(60px + env(safe-area-inset-top));
            left: 20px;
            right: 20px;
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            transform: translateY(-200%);
            transition: transform 0.3s ease;
        }

        .notification.show { transform: translateY(0); }

        .history-item {
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>FitTrack</h1>
            <div class="streak">🔥 <span id="streak-count">0</span></div>
        </div>
    </header>

    <div class="container">
        <div id="setup" class="setup" style="max-width: 400px; margin: 40px auto;">
            <div class="wizard-step active" id="step1">
                <div class="card">
                    <h2 class="card-title" style="font-size: 24px;">Bienvenue</h2>
                    <div class="form-group">
                        <label>Sexe</label>
                        <select id="setup-gender">
                            <option value="male">Homme</option>
                            <option value="female">Femme</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Âge</label>
                        <input type="number" id="setup-age" placeholder="27">
                    </div>
                    <div class="form-group">
                        <label>Taille (cm)</label>
                        <input type="number" id="setup-height" placeholder="175">
                    </div>
                    <div class="form-group">
                        <label>Activité</label>
                        <select id="setup-activity">
                            <option value="sedentary">Sédentaire</option>
                            <option value="light">Léger (1-3x/sem)</option>
                            <option value="moderate">Modéré (3-5x/sem)</option>
                            <option value="active">Actif (6-7x/sem)</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="nextStep()">Suivant</button>
                </div>
            </div>

            <div class="wizard-step" id="step2" style="display: none;">
                <div class="card">
                    <h2 class="card-title">Objectif</h2>
                    <div class="form-group">
                        <label>Poids actuel (kg)</label>
                        <input type="number" id="setup-current-weight" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Poids cible (kg)</label>
                        <input type="number" id="setup-target-weight" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Rythme</label>
                        <select id="setup-pace">
                            <option value="slow">Lent (-0.25kg/sem)</option>
                            <option value="moderate" selected>Modéré (-0.5kg/sem)</option>
                            <option value="fast">Rapide (-0.75kg/sem)</option>
                        </select>
                    </div>
                    <div id="summary" style="background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 16px; display: none;">
                        <p id="summary-text" style="font-size: 14px; color: var(--text-secondary);"></p>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="completeSetup()">Commencer</button>
                </div>
            </div>
        </div>

        <div id="app" style="display: none;">
            <div id="home-tab" class="tab-content active">
                <div class="quick-add">
                    <div class="quick-add-title">Actions rapides</div>
                    <div class="quick-grid">
                        <button class="quick-btn" onclick="openModal('meals-modal')">
                            <span class="quick-icon">🍽️</span> Repas
                        </button>
                        <button class="quick-btn" onclick="addWater(this)" oncontextmenu="event.preventDefault(); openModal('water-modal');">
                            <span class="quick-icon">💧</span> <span id="water-container-label">Verre</span>
                        </button>
                        <button class="quick-btn" onclick="openModal('sleep-modal')">
                            <span class="quick-icon">😴</span> Sommeil
                        </button>
                        <button class="quick-btn" onclick="openModal('sync-modal')">
                            <span class="quick-icon">⚖️</span> Poids
                        </button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Calories</div>
                        <div class="stat-value"><span id="cal-now">0</span>/<span id="cal-goal">0</span></div>
                        <div class="stat-progress"><div class="stat-fill" id="cal-fill" style="width: 0%"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Hydratation</div>
                        <div class="stat-value" style="font-size: 18px;"><span id="water-now">0</span>/<span id="water-goal">2000</span>ml</div>
                        <div class="stat-progress"><div class="stat-fill" id="water-fill" style="width: 0%; background: var(--success)"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Sommeil</div>
                        <div class="stat-value" id="sleep-value">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Poids</div>
                        <div class="stat-value" id="weight-value">-</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Journal d'aujourd'hui</div>
                    <div id="today-log"></div>
                </div>
            </div>

            <div id="data-tab" class="tab-content">
                <div class="card">
                    <div class="card-title">Historique & Stats</div>
                    <div id="stats-content"></div>
                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 12px; font-size: 15px; color: var(--text-tertiary);">Jours précédents</h4>
                        <div id="history-log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="meals-modal" class="modal"><div class="modal-content"><div class="modal-header"><h3 class="card-title">Ajouter un repas</h3><button class="close-modal" onclick="closeModal('meals-modal')">×</button></div><div class="meal-grid" id="meals-list"></div></div></div>
    <div id="water-modal" class="modal"><div class="modal-content"><div class="modal-header"><h3 class="card-title">Contenant</h3><button class="close-modal" onclick="closeModal('water-modal')">×</button></div><div class="meal-grid" id="water-containers"></div></div></div>
    
    <div id="sleep-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="card-title">Sommeil</h3><button class="close-modal" onclick="closeModal('sleep-modal')">×</button></div>
            <div class="form-group"><label>Coucher</label><input type="time" id="sleep-bed"></div>
            <div class="form-group"><label>Réveil</label><input type="time" id="sleep-wake"></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="logSleep()">Enregistrer</button>
        </div>
    </div>

    <div id="sync-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="card-title">Sync données</h3><button class="close-modal" onclick="closeModal('sync-modal')">×</button></div>
            <div class="form-group"><label>Poids (kg)</label><input type="number" id="sync-weight" step="0.1"></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="syncData()">Synchroniser</button>
        </div>
    </div>

    <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>

    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('home', this)"><span class="tab-icon">🏠</span><span>Accueil</span></button>
        <button class="tab-item" onclick="switchTab('data', this)"><span class="tab-icon">📊</span><span>Données</span></button>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const meals = [
            {name: 'Petit-déj léger', icon: '🥐', cal: 200},
            {name: 'Petit-déj complet', icon: '☕', cal: 350},
            {name: 'Déjeuner léger', icon: '🥗', cal: 450},
            {name: 'Déjeuner complet', icon: '🍱', cal: 700},
            {name: 'Dîner léger', icon: '🥙', cal: 400},
            {name: 'Dîner complet', icon: '🍽️', cal: 650},
            {name: 'Snack', icon: '🍎', cal: 150}
        ];

        const waterContainers = [
            {name: 'Verre', icon: '🥤', ml: 250},
            {name: 'Petite gourde', icon: '🧃', ml: 500},
            {name: 'Grande gourde', icon: '💧', ml: 750},
            {name: 'Bouteille', icon: '🍾', ml: 1000}
        ];

        let data = {
            setup: false,
            profile: {gender: 'male', age: 27, height: 175, activity: 'moderate', weight: 75, target: 70, pace: 'moderate'},
            goals: {cal: 2000, waterMl: 2000},
            history: [], // Stockage des jours passés
            today: {date: new Date().toDateString(), foods: [], waterMl: 0, cal: 0},
            waterContainer: {name: 'Verre', icon: '🥤', ml: 250},
            metrics: {weight: [], fat: []},
            sleep: [],
            streak: 0
        };

        function calcBMR() {
            const {gender, age, height, weight} = data.profile;
            return gender === 'male' ? (10 * weight) + (6.25 * height) - (5 * age) + 5 : (10 * weight) + (6.25 * height) - (5 * age) - 161;
        }

        function calcTDEE() {
            const mult = {sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725};
            return Math.round(calcBMR() * (mult[data.profile.activity] || 1.2));
        }

        function calcGoal() {
            const def = {slow: 250, moderate: 500, fast: 750};
            return Math.round(calcTDEE() - def[data.profile.pace]);
        }

        function addWater(btn) {
            data.today.waterMl += data.waterContainer.ml;
            save();
            render();
            
            // Feedback visuel sur le bouton passé en paramètre
            if(btn) {
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => btn.style.transform = 'scale(1)', 150);
            }
            notify(`💧 +${data.waterContainer.ml}ml`);
        }

        function selectContainer(container) {
            data.waterContainer = container;
            save();
            render();
            closeModal('water-modal');
            notify(`${container.icon} ${container.name} sélectionné`);
        }

        function nextStep() {
            data.profile.age = parseInt($('setup-age').value);
            data.profile.height = parseInt($('setup-height').value);
            if (!data.profile.age || !data.profile.height) return notify('Remplis tous les champs');
            
            $('step1').style.display = 'none';
            $('step2').style.display = 'block';
        }

        function completeSetup() {
            data.profile.weight = parseFloat($('setup-current-weight').value);
            data.profile.target = parseFloat($('setup-target-weight').value);
            if (!data.profile.weight) return notify('Poids requis');
            
            data.goals.cal = calcGoal();
            data.goals.waterMl = Math.round(data.profile.weight * 30);
            data.setup = true;
            
            $('setup').style.display = 'none';
            $('app').style.display = 'block';
            save();
            render();
        }

        function addFood(name, cal) {
            data.today.foods.push({name, cal, time: new Date().toLocaleTimeString().slice(0,5)});
            data.today.cal += cal;
            save();
            render();
            closeModal('meals-modal');
            notify(`✅ ${name} ajouté`);
        }

        function logSleep() {
            const bed = $('sleep-bed').value;
            const wake = $('sleep-wake').value;
            if (!bed || !wake) return notify('Champs vides');
            const b = new Date(`2000-01-01T${bed}`);
            let w = new Date(`2000-01-01T${wake}`);
            if (w < b) w = new Date(`2000-01-02T${wake}`);
            const hrs = ((w - b) / 3600000).toFixed(1);
            data.sleep.unshift({date: new Date().toLocaleDateString(), hrs});
            save();
            render();
            closeModal('sleep-modal');
        }

        function syncData() {
            const w = parseFloat($('sync-weight').value);
            if (w) {
                data.metrics.weight.push({date: new Date().toDateString(), val: w});
                data.profile.weight = w;
            }
            save();
            render();
            closeModal('sync-modal');
            notify('✅ Poids mis à jour');
        }

        function render() {
            // Stats Accueil
            $('cal-now').textContent = data.today.cal;
            $('cal-goal').textContent = data.goals.cal;
            $('cal-fill').style.width = Math.min(100, (data.today.cal / data.goals.cal) * 100) + '%';
            
            $('water-now').textContent = data.today.waterMl;
            $('water-goal').textContent = data.goals.waterMl;
            $('water-fill').style.width = Math.min(100, (data.today.waterMl / data.goals.waterMl) * 100) + '%';
            
            $('sleep-value').textContent = data.sleep[0] ? data.sleep[0].hrs + 'h' : '-';
            $('weight-value').textContent = data.profile.weight + 'kg';
            $('streak-count').textContent = data.streak;
            $('water-container-label').textContent = data.waterContainer.name;

            // Journal
            $('today-log').innerHTML = data.today.foods.length ? data.today.foods.map((f, i) => `
                <div class="list-item">
                    <div><strong>${f.name}</strong><br><span style="font-size:13px; color:var(--text-tertiary)">${f.cal} kcal • ${f.time}</span></div>
                    <button style="color:var(--danger); background:none; border:none; font-size:20px;" onclick="deleteFood(${i})">×</button>
                </div>
            `).join('') : '<p style="text-align:center; color:var(--text-tertiary); padding:20px;">Rien pour le moment</p>';

            // Listes modales
            $('meals-list').innerHTML = meals.map(m => `<div class="meal-card" onclick="addFood('${m.name}', ${m.cal})"><div><strong>${m.name}</strong><br>${m.cal} kcal</div><div style="font-size:24px">${m.icon}</div></div>`).join('');
            $('water-containers').innerHTML = waterContainers.map(c => `<div class="meal-card" onclick='selectContainer(${JSON.stringify(c)})'><div><strong>${c.name}</strong><br>${c.ml}ml</div><div style="font-size:24px">${c.icon}</div></div>`).join('');

            // Onglet Données - Stats
            $('stats-content').innerHTML = `
                <div class="list-item"><span>Poids actuel</span><strong>${data.profile.weight} kg</strong></div>
                <div class="list-item"><span>Objectif eau</span><strong>${data.goals.waterMl} ml</strong></div>
                <div class="list-item"><span>Objectif calories</span><strong>${data.goals.cal} kcal</strong></div>
            `;

            // Onglet Données - Historique
            $('history-log').innerHTML = data.history.length ? data.history.map(h => `
                <div class="history-item">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <strong>${new Date(h.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}</strong>
                        <span style="color:var(--primary); font-weight:bold;">${h.cal} kcal</span>
                    </div>
                    <div style="font-size:12px; color:var(--text-secondary)">💧 ${h.waterMl}ml</div>
                </div>
            `).reverse().join('') : '<p style="text-align:center; color:var(--text-tertiary);">Aucun historique</p>';
        }

        function deleteFood(i) {
            data.today.cal -= data.today.foods[i].cal;
            data.today.foods.splice(i, 1);
            save();
            render();
        }

        function switchTab(name, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            $(`${name}-tab`).classList.add('active');
        }

        function openModal(id) { $(id).classList.add('active'); }
        function closeModal(id) { $(id).classList.remove('active'); }

        function notify(msg) {
            const n = $('notification');
            n.textContent = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2000);
        }

        async function save() {
            try { await window.storage.set('fit', JSON.stringify(data)); } catch (e) {}
        }

        async function load() {
            try {
                const s = await window.storage.get('fit');
                if (s?.value) {
                    data = JSON.parse(s.value);
                    if (!data.history) data.history = [];
                    
                    // Gestion du changement de jour
                    const currentDate = new Date().toDateString();
                    if (data.today.date !== currentDate) {
                        // Archivage si la journée n'était pas vide
                        if (data.today.cal > 0 || data.today.waterMl > 0) {
                            data.history.push({...data.today});
                            // On garde seulement les 30 derniers jours pour ne pas saturer la mémoire
                            if (data.history.length > 30) data.history.shift();
                        }
                        // Reset
                        data.today = {date: currentDate, foods: [], waterMl: 0, cal: 0};
                        save();
                    }

                    if (data.setup) {
                        $('setup').style.display = 'none';
                        $('app').style.display = 'block';
                        render();
                    }
                }
            } catch (e) {}
        }

        const $ = id => document.getElementById(id);
        load();
    </script>
</body>
</html>
