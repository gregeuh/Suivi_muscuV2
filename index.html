<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>FitTrack</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        :root {
            /* Palette chaleureuse et moderne */
            --primary: #FF6B6B;
            --primary-grad: linear-gradient(135deg, #FF8E53, #FF6B6B);
            --water: #48C774; /* Vert menthe frais au lieu d'un bleu froid */
            --water-grad: linear-gradient(135deg, #20E2D7, #48C774);
            --sleep: #8A2BE2;
            --bg: #F7F9FC; /* Fond très légèrement bleuté/gris, plus doux que le blanc pur */
            --surface: #FFFFFF;
            --text-dark: #2D3436;
            --text-light: #A0AEC0;
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.05);
            --shadow-floating: 0 14px 28px rgba(255, 107, 107, 0.2);
            --radius-lg: 28px;
            --radius-md: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* --- HEADER ACCUEILLANT --- */
        header {
            padding: calc(24px + env(safe-area-inset-top)) 24px 16px;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .greeting {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .streak-badge {
            background: white;
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            color: #FF9500;
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            padding: 0 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- CARTES & WIDGETS --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: none;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        /* Grille Actions Rapides */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: var(--surface);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-icon {
            font-size: 28px;
            height: 48px;
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 16px;
        }

        .action-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-light);
        }

        /* Grosses cartes de stats */
        .main-stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-widget {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }

        .stat-widget.primary {
            background: var(--primary-grad);
            color: white;
        }

        .stat-widget.water {
            background: var(--water-grad);
            color: white;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .widget-title { font-size: 15px; opacity: 0.9; }
        .widget-icon { font-size: 20px; }
        
        .widget-value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 12px;
        }

        .widget-sub {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 600;
        }

        .progress-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- JOURNAL & LISTES --- */
        .log-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--bg);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }

        .log-icon {
            font-size: 24px;
            margin-right: 16px;
            background: white;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .log-details { flex-grow: 1; }
        .log-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
        .log-meta { font-size: 13px; color: var(--text-light); font-weight: 600; }
        
        .log-cal {
            font-weight: 800;
            color: var(--primary);
            font-size: 16px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #FF3B30;
            font-size: 24px;
            margin-left: 12px;
            padding: 8px;
            cursor: pointer;
            opacity: 0.5;
        }

        /* --- INPUTS & BOUTONS --- */
        input, select {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text-dark);
            transition: all 0.2s;
            margin-bottom: 16px;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: 100px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-floating);
            transition: transform 0.2s;
        }

        .btn-main:active { transform: translateY(2px); }

        /* --- MODALES BOTTOM SHEET (ERGONOMIE) --- */
        .modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 35, 45, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: flex-end; /* Colle le contenu en bas */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-height: 85vh;
            border-radius: 32px 32px 0 0; /* Arrondi seulement en haut */
            padding: 32px 24px calc(24px + env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-drag {
            width: 40px; height: 5px;
            background: #E2E8F0;
            border-radius: 3px;
            margin: -10px auto 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title { font-size: 22px; font-weight: 800; }
        .close-btn {
            background: var(--bg);
            border: none;
            width: 36px; height: 36px;
            border-radius: 18px;
            font-size: 20px;
            color: var(--text-light);
            cursor: pointer;
        }

        /* Choix dans les modales */
        .choice-grid {
            display: grid; gap: 12px;
        }

        .choice-card {
            background: var(--bg);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .choice-card:active { background: #E2E8F0; }
        
        /* --- NAVIGATION FLOTTANTE --- */
        .tab-bar {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 24px; right: 24px;
            background: var(--surface);
            border-radius: 100px;
            padding: 8px;
            display: flex;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-light);
            border-radius: 100px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .tab-item.active {
            background: var(--bg);
            color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeUp 0.4s ease; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- NOTIFICATION --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--text-dark);
            color: white;
            padding: 14px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; align-items: center; gap: 8px;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Setup / Bienvenue */
        .setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 3000;
            display: flex; flex-direction: column; justify-content: center;
            padding: 24px;
        }

        .setup-illustration {
            font-size: 72px; text-align: center; margin-bottom: 24px;
        }

        .wizard-step { display: none; animation: fadeUp 0.4s ease; }
        .wizard-step.active { display: block; }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-light);
            font-weight: 600;
        }
        .empty-emoji { font-size: 40px; margin-bottom: 12px; display: block; }
    </style>
</head>
<body>

    <div id="setup" class="setup-screen" style="display: none;">
        <div class="wizard-step active" id="step1">
            <div class="setup-illustration">👋</div>
            <h1 style="text-align: center; margin-bottom: 8px;">Bienvenue</h1>
            <p style="text-align: center; color: var(--text-light); font-weight: 600; margin-bottom: 32px;">Personnalisons ton expérience.</p>
            
            <div class="card">
                <label>Sexe</label>
                <select id="setup-gender">
                    <option value="male">Homme</option>
                    <option value="female">Femme</option>
                </select>
                <label>Âge</label>
                <input type="number" id="setup-age" placeholder="ex: 27">
                <label>Taille (cm)</label>
                <input type="number" id="setup-height" placeholder="ex: 175">
            </div>
            <button class="btn-main" onclick="nextStep()">Continuer</button>
        </div>

        <div class="wizard-step" id="step2">
            <div class="setup-illustration">🎯</div>
            <h1 style="text-align: center; margin-bottom: 32px;">Ton Objectif</h1>
            
            <div class="card">
                <label>Poids actuel (kg)</label>
                <input type="number" id="setup-current-weight" step="0.1">
                
                <label>Poids cible (kg)</label>
                <input type="number" id="setup-target-weight" step="0.1">
                
                <label>Rythme</label>
                <select id="setup-pace">
                    <option value="slow">Tranquille</option>
                    <option value="moderate" selected>Normal</option>
                    <option value="fast">Intense</option>
                </select>
            </div>
            <button class="btn-main" onclick="completeSetup()">C'est parti !</button>
        </div>
    </div>

    <div id="app" style="display: none;">
        
        <header>
            <div class="header-top">
                <div>
                    <div class="greeting">Bonjour ! 👋</div>
                    <h1>Aujourd'hui</h1>
                </div>
                <div class="streak-badge">
                    🔥 <span id="streak-count">0</span>
                </div>
            </div>
        </header>

        <div class="container">
            
            <div id="home-tab" class="tab-content active">
                
                <div class="action-grid">
                    <button class="action-btn" onclick="openModal('meals-modal')">
                        <div class="action-icon">🍽️</div>
                        <span class="action-label">Repas</span>
                    </button>
                    <button class="action-btn" onclick="addWater(this)" oncontextmenu="event.preventDefault(); openModal('water-modal');">
                        <div class="action-icon">💧</div>
                        <span class="action-label" id="water-container-label">Verre</span>
                    </button>
                    <button class="action-btn" onclick="openModal('sleep-modal')">
                        <div class="action-icon">😴</div>
                        <span class="action-label">Sommeil</span>
                    </button>
                    <button class="action-btn" onclick="openModal('sync-modal')">
                        <div class="action-icon">⚖️</div>
                        <span class="action-label">Poids</span>
                    </button>
                </div>

                <div class="main-stats">
                    <div class="stat-widget primary">
                        <div class="widget-header">
                            <span class="widget-title">Calories</span>
                            <span class="widget-icon">⚡</span>
                        </div>
                        <div class="widget-value" id="cal-now">0</div>
                        <div class="widget-sub">sur <span id="cal-goal">0</span> kcal</div>
                        <div class="progress-track">
                            <div class="progress-fill" id="cal-fill" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="stat-widget water">
                        <div class="widget-header">
                            <span class="widget-title">Hydratation</span>
                            <span class="widget-icon">💧</span>
                        </div>
                        <div class="widget-value"><span id="water-now">0</span> ml</div>
                        <div class="widget-sub">sur <span id="water-goal">2000</span> ml</div>
                        <div class="progress-track">
                            <div class="progress-fill" id="water-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Journal des repas</div>
                <div id="today-log">
                    </div>
            </div>

            <div id="data-tab" class="tab-content">
                <div class="section-title">Vue d'ensemble</div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                        <span style="font-weight:700; color:var(--text-light)">Poids actuel</span>
                        <strong style="font-size:18px" id="stats-weight">- kg</strong>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-weight:700; color:var(--text-light)">Dernier sommeil</span>
                        <strong style="font-size:18px" id="stats-sleep">-</strong>
                    </div>
                </div>

                <div class="section-title" style="margin-top:32px;">Historique</div>
                <div id="history-log">
                    </div>
            </div>

        </div>
    </div>

    <div id="meals-modal" class="modal" onclick="closeOnBackdrop(event, 'meals-modal')">
        <div class="modal-content">
            <div class="modal-drag"></div>
            <div class="modal-header">
                <h3 class="modal-title">Ajouter un repas</h3>
                <button class="close-btn" onclick="closeModal('meals-modal')">✕</button>
            </div>
            <div class="choice-grid" id="meals-list"></div>
        </div>
    </div>

    <div id="water-modal" class="modal" onclick="closeOnBackdrop(event, 'water-modal')">
        <div class="modal-content">
            <div class="modal-drag"></div>
            <div class="modal-header">
                <h3 class="modal-title">Choisir le contenant</h3>
                <button class="close-btn" onclick="closeModal('water-modal')">✕</button>
            </div>
            <div class="choice-grid" id="water-containers"></div>
        </div>
    </div>
    
    <div id="sleep-modal" class="modal" onclick="closeOnBackdrop(event, 'sleep-modal')">
        <div class="modal-content">
            <div class="modal-drag"></div>
            <div class="modal-header">
                <h3 class="modal-title">Sommeil</h3>
                <button class="close-btn" onclick="closeModal('sleep-modal')">✕</button>
            </div>
            <label>Heure de coucher</label>
            <input type="time" id="sleep-bed">
            <label>Heure de réveil</label>
            <input type="time" id="sleep-wake">
            <button class="btn-main" style="margin-top:16px;" onclick="logSleep()">Enregistrer</button>
        </div>
    </div>

    <div id="sync-modal" class="modal" onclick="closeOnBackdrop(event, 'sync-modal')">
        <div class="modal-content">
            <div class="modal-drag"></div>
            <div class="modal-header">
                <h3 class="modal-title">Nouveau poids</h3>
                <button class="close-btn" onclick="closeModal('sync-modal')">✕</button>
            </div>
            <label>Ton poids aujourd'hui (kg)</label>
            <input type="number" id="sync-weight" step="0.1" placeholder="ex: 70.5">
            <button class="btn-main" style="margin-top:16px;" onclick="syncData()">Mettre à jour</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('home', this)">
            <span style="font-size:20px;">🏠</span> Accueil
        </button>
        <button class="tab-item" onclick="switchTab('data', this)">
            <span style="font-size:20px;">📊</span> Données
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // --- DONNEES ---
        const meals = [
            {name: 'Petit-déjeuner', icon: '🥐', cal: 350},
            {name: 'Déjeuner', icon: '🥗', cal: 600},
            {name: 'Dîner', icon: '🍽️', cal: 550},
            {name: 'En-cas', icon: '🍎', cal: 150},
            {name: 'Shaker', icon: '🥤', cal: 120}
        ];

        const waterContainers = [
            {name: 'Verre', icon: '🥛', ml: 250},
            {name: 'Petite gourde', icon: '🧃', ml: 500},
            {name: 'Grande gourde', icon: '💧', ml: 750},
            {name: 'Bouteille', icon: '🍾', ml: 1000}
        ];

        let data = {
            setup: false,
            profile: {gender: 'male', age: 27, height: 175, weight: 75, target: 70, pace: 'moderate'},
            goals: {cal: 2000, waterMl: 2000},
            history: [], 
            today: {date: new Date().toDateString(), foods: [], waterMl: 0, cal: 0},
            waterContainer: {name: 'Verre', icon: '🥛', ml: 250},
            sleep: [],
            streak: 0
        };

        // --- LOGIQUE ---
        function calcGoals() {
            const w = data.profile.weight;
            // BMR basique
            const bmr = data.profile.gender === 'male' ? (10 * w) + (6.25 * data.profile.height) - (5 * data.profile.age) + 5 : (10 * w) + (6.25 * data.profile.height) - (5 * data.profile.age) - 161;
            const tdee = bmr * 1.375; // light activity default
            const def = {slow: 250, moderate: 500, fast: 750};
            
            data.goals.cal = Math.round(tdee - def[data.profile.pace]);
            data.goals.waterMl = Math.round(w * 30);
        }

        // --- ACTIONS ---
        function addWater(btn) {
            data.today.waterMl += data.waterContainer.ml;
            save();
            render();
            if(btn) {
                btn.style.transform = 'scale(0.85)';
                setTimeout(() => btn.style.transform = 'scale(1)', 150);
            }
            showToast(`💧 +${data.waterContainer.ml}ml ajoutés`);
        }

        function selectContainer(container) {
            data.waterContainer = container;
            save();
            render();
            closeModal('water-modal');
            showToast(`Contenant par défaut : ${container.name}`);
        }

        function addFood(name, cal, icon) {
            data.today.foods.push({name, cal, icon, time: new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})});
            data.today.cal += cal;
            save();
            render();
            closeModal('meals-modal');
            showToast(`😋 ${name} ajouté`);
        }

        function deleteFood(i) {
            data.today.cal -= data.today.foods[i].cal;
            data.today.foods.splice(i, 1);
            save();
            render();
        }

        function logSleep() {
            const bed = $('sleep-bed').value;
            const wake = $('sleep-wake').value;
            if (!bed || !wake) return showToast('Heures manquantes');
            
            const b = new Date(`2000-01-01T${bed}`);
            let w = new Date(`2000-01-01T${wake}`);
            if (w < b) w = new Date(`2000-01-02T${wake}`);
            
            const hrs = ((w - b) / 3600000).toFixed(1);
            data.sleep.unshift({date: new Date().toLocaleDateString(), hrs});
            save();
            render();
            closeModal('sleep-modal');
            showToast('😴 Sommeil enregistré');
        }

        function syncData() {
            const w = parseFloat($('sync-weight').value);
            if (w) {
                data.profile.weight = w;
                calcGoals(); // Recalculer les obj.
            }
            save();
            render();
            closeModal('sync-modal');
            showToast('✅ Poids mis à jour');
        }

        // --- SETUP ---
        function nextStep() {
            data.profile.age = parseInt($('setup-age').value);
            data.profile.height = parseInt($('setup-height').value);
            data.profile.gender = $('setup-gender').value;
            
            if (!data.profile.age || !data.profile.height) return showToast('Complète les infos');
            
            $('step1').classList.remove('active');
            $('step2').classList.add('active');
        }

        function completeSetup() {
            data.profile.weight = parseFloat($('setup-current-weight').value);
            data.profile.target = parseFloat($('setup-target-weight').value);
            data.profile.pace = $('setup-pace').value;
            
            if (!data.profile.weight) return showToast('Poids requis');
            
            calcGoals();
            data.setup = true;
            
            $('setup').style.display = 'none';
            $('app').style.display = 'block';
            save();
            render();
        }

        // --- UI RENDERING ---
        function render() {
            // Stats
            $('cal-now').textContent = data.today.cal;
            $('cal-goal').textContent = data.goals.cal;
            $('cal-fill').style.width = Math.min(100, (data.today.cal / data.goals.cal) * 100) + '%';
            
            $('water-now').textContent = data.today.waterMl;
            $('water-goal').textContent = data.goals.waterMl;
            $('water-fill').style.width = Math.min(100, (data.today.waterMl / data.goals.waterMl) * 100) + '%';
            
            $('streak-count').textContent = data.streak;
            $('water-container-label').textContent = data.waterContainer.name;

            // Stats tab
            $('stats-weight').textContent = data.profile.weight + ' kg';
            $('stats-sleep').textContent = data.sleep[0] ? data.sleep[0].hrs + 'h' : 'Aucun';

            // Lists
            $('meals-list').innerHTML = meals.map(m => `
                <div class="choice-card" onclick="addFood('${m.name}', ${m.cal}, '${m.icon}')">
                    <div style="font-size:32px">${m.icon}</div>
                    <div><div style="font-weight:700">${m.name}</div><div style="color:var(--text-light); font-size:14px">${m.cal} kcal</div></div>
                </div>
            `).join('');
            
            $('water-containers').innerHTML = waterContainers.map(c => `
                <div class="choice-card" onclick='selectContainer(${JSON.stringify(c)})'>
                    <div style="font-size:32px">${c.icon}</div>
                    <div><div style="font-weight:700">${c.name}</div><div style="color:var(--text-light); font-size:14px">${c.ml} ml</div></div>
                </div>
            `).join('');

            // Journal
            $('today-log').innerHTML = data.today.foods.length ? data.today.foods.map((f, i) => `
                <div class="log-item">
                    <div class="log-icon">${f.icon || '🍽️'}</div>
                    <div class="log-details">
                        <div class="log-name">${f.name}</div>
                        <div class="log-meta">${f.time}</div>
                    </div>
                    <div class="log-cal">${f.cal}</div>
                    <button class="delete-btn" onclick="deleteFood(${i})">✕</button>
                </div>
            `).join('') : `
                <div class="empty-state">
                    <span class="empty-emoji">🍽️</span>
                    Aucun repas pour le moment.<br>Il est temps de manger !
                </div>
            `;

            $('history-log').innerHTML = data.history.length ? data.history.map(h => `
                <div class="log-item" style="background:var(--surface); box-shadow:var(--shadow-soft);">
                    <div class="log-details">
                        <div class="log-name">${new Date(h.date).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'short'})}</div>
                        <div class="log-meta">💧 ${h.waterMl} ml bus</div>
                    </div>
                    <div class="log-cal" style="color: ${h.cal > data.goals.cal ? '#FF9500' : 'var(--primary)'}">${h.cal}</div>
                </div>
            `).reverse().join('') : `
                <div class="empty-state" style="background:var(--surface); border-radius:20px;">
                    <span class="empty-emoji">📅</span>
                    Ton historique apparaîtra ici demain.
                </div>
            `;
        }

        // --- UTILITAIRES ---
        function switchTab(name, btn) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            $(`${name}-tab`).classList.add('active');
        }

        function openModal(id) { 
            $(id).classList.add('active'); 
            document.body.style.overflow = 'hidden'; 
        }
        
        function closeModal(id) { 
            $(id).classList.remove('active'); 
            document.body.style.overflow = ''; 
        }

        function closeOnBackdrop(e, id) {
            if (e.target.id === id) closeModal(id);
        }

        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // --- SYSTEME DE SAUVEGARDE ---
        async function save() {
            try { await window.storage.set('fit', JSON.stringify(data)); } catch (e) {}
        }

        async function load() {
            try {
                const s = await window.storage.get('fit');
                if (s?.value) {
                    const savedData = JSON.parse(s.value);
                    // Fusion pour ne pas perdre les nouvelles variables si l'utilisateur met à jour
                    data = { ...data, ...savedData }; 
                    if (!data.history) data.history = [];
                    
                    const currentDate = new Date().toDateString();
                    if (data.today.date !== currentDate) {
                        if (data.today.cal > 0 || data.today.waterMl > 0) {
                            data.history.push({...data.today});
                            if (data.history.length > 30) data.history.shift();
                        }
                        data.today = {date: currentDate, foods: [], waterMl: 0, cal: 0};
                        save();
                    }
                }
                
                if (data.setup) {
                    $('app').style.display = 'block';
                    render();
                } else {
                    $('setup').style.display = 'flex';
                }
            } catch (e) {
                // En cas d'erreur de lecture, on affiche le setup
                $('setup').style.display = 'flex';
            }
        }

        const $ = id => document.getElementById(id);
        load();
    </script>
</body>
</html>
